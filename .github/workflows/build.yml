name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse0 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -r requirements.txt "pyinstaller>=6.16,<7"
      - run: python scripts/build.py
      - name: UI smoke test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          TABOTA_NO_AUDIO: '1'
          TABOTA_DATA_DIR: ${{ runner.temp }}/tabota-test
        run: python main.py --screenshot test-artifacts/menu.png
      - name: Package release archive (preserve symbolic links)
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: TABOt-${{ runner.os }}-${{ runner.arch }}
          path: dist/packages/*
          compression-level: 0
          if-no-files-found: error
